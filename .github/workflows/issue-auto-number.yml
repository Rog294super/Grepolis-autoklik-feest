name: Auto-Assign Issue Number

on:
  issues:
    types:
      - opened

jobs:
  add_comment_with_number:
    runs-on: ubuntu-latest

    steps:
      - name: Add comment with issue number
        run: |
          issue_number=${{ github.event.issue.number }}
          echo "Adding comment with issue number: $issue_number"
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -d '{"body": "This is issue number '\"$issue_number\"'."}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/$issue_number/comments"
